
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tourism Search</title>
</head>
<body>
    <h1>Tourism Search</h1>
    <form action="/search" method="post">
        <label for="attraction_type">Select Attraction Type:</label>
        <select name="attraction_type" id="attraction_type">
            <option value="historical_cultural">Understand the past and Heritage</option>
            <option value="events_festival">Enjoy the creative events and colourful festival</option>
            <option value="natural_attractions">Capture the natural beauty and attractions</option>
            <option value="city">Explore the vibrant cities</option>
            <option value="museum">Visit the museums and educational sites</option>
        </select>
        <button type="submit">Search</button>
    </form>
</body>
</html>
