<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Southern Germany</title>
</head>
<body>
    <h1>Explore Southern Germany</h1>

    {% for region in regions_data %}
        <div>
            <h2>{{ region['label'] }}</h2>            
            <p>{{ region['description'] }}</p>
            <img src="{{ region['image'] }}" alt="{{ region['label'] }} Image" style="max-width: 500px;">
        </div>
    {% endfor %}

</body>
</html>
